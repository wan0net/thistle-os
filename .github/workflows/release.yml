name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.5.1
        required: true
      run_id:
        description: Successful ThistleOS CI run ID to source artifacts from
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/validate_release.py tag "$RELEASE_TAG"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --tags
          tag_commit="$(git rev-parse --verify "$RELEASE_TAG^{commit}")"
          echo "RELEASE_TAG_COMMIT=$tag_commit" >> "$GITHUB_ENV"

      - name: Validate CI artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: run_id must be numeric" >&2
            exit 1
          fi
          metadata="$RUNNER_TEMP/release-source-run.json"
          gh api \
            "repos/$EXPECTED_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$metadata"
          python3 tools/validate_release.py run "$metadata" \
            --repository "$EXPECTED_REPOSITORY" \
            --commit "$RELEASE_TAG_COMMIT"

      - name: Download CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --dir release-artifacts

      - name: Stage versioned assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in esp32 esp32s2 esp32s3 esp32c3 esp32c6; do
            artifact_dir="release-artifacts/thistle-os-firmware-$arch"
            manifest="$artifact_dir/thistle_os.bin.manifest"
            manifest_version="$(sed -n 's/^version=//p' "$manifest")"
            manifest_arch="$(sed -n 's/^arch=//p' "$manifest")"
            if [ "$RELEASE_TAG" != "v$manifest_version" ]; then
              echo "ERROR: release tag $RELEASE_TAG does not match $arch manifest version $manifest_version" >&2
              exit 1
            fi
            if [ "$manifest_arch" != "$arch" ]; then
              echo "ERROR: $arch artifact has manifest architecture $manifest_arch" >&2
              exit 1
            fi
            destination="dist/thistle_os-${arch}-${RELEASE_TAG}.bin"
            cp "$artifact_dir/thistle_os.bin" "$destination"
            cp "$artifact_dir/thistle_os.bin.sig" "$destination.sig"
            cp "$manifest" "$destination.manifest"
            cp "$artifact_dir/thistle_os.bin.manifest.sig" "$destination.manifest.sig"
            cp "$artifact_dir/thistle_os.bin.pub" "$destination.pub"
          done
          find release-artifacts/thistle-os-firmware-* \
            -path '*/signed-board-profiles/*' -type f -exec cp {} dist/ \;
          cp release-artifacts/thistle-recovery/thistle-recovery "dist/thistle-recovery-${RELEASE_TAG}"
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          awk -v tag="$RELEASE_TAG" '
            $0 ~ "^## " tag "($| - )" { capture=1; print; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            printf "Release %s\n" "$RELEASE_TAG" > "$notes"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "ThistleOS ${RELEASE_TAG}" --notes-file "$notes"
          fi
