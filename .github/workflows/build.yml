name: ThistleOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  THISTLE_CI_JOBS: 2

jobs:
  firmware-build:
    name: Build Firmware (${{ matrix.arch }})
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    container:
      image: espressif/idf:v5.5
    strategy:
      fail-fast: false
      matrix:
        arch: [esp32, esp32s2, esp32s3, esp32c3, esp32c6]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Rust ESP toolchain
        uses: actions/cache@v6
        id: rust-cache
        with:
          path: |
            /root/.cargo
            /root/.rustup
          key: rust-esp-toolchain-v4-rust185-espup016
          # Don't restore from older prefixes — older caches have espup 0.17.0
          # contents that break the build. Only match the fully-qualified key.

      - name: Install Rust ESP toolchain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain 1.85.0
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install 1.85.0 --profile minimal
          # Pin espup to 0.16.0 — 0.17.0 (released 2026-04-17) has a regression
          # that aborts with "Unsuported file extension: 'part'" during install.
          if ! command -v espup &> /dev/null || [ "$(espup --version 2>/dev/null | awk '{print $2}')" != "0.16.0" ]; then
            cargo +1.85.0 install espup --version 0.16.0 --locked --force
          fi
          if ! command -v ldproxy &>/dev/null; then
            espup install
          fi
          # NOTE: Do NOT source export-esp.sh here — it overrides ESP-IDF's
          # GCC with an incompatible version. The kernel_rs CMakeLists.txt
          # adds cargo to PATH when invoking the Rust build.

      - name: Cache ESP-IDF + Rust builds
        uses: actions/cache@v6
        with:
          path: |
            build
            managed_components
            components/kernel_rs/target
          key: espidf-v5.5-rust-${{ matrix.arch }}-${{ hashFiles('components/**/*.c', 'components/**/*.h', 'components/kernel_rs/src/**', 'main/**', 'sdkconfig.defaults*', 'partitions.csv') }}
          restore-keys: |
            espidf-v5.5-rust-${{ matrix.arch }}-

      - name: Build firmware
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          . $IDF_PATH/export.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          idf.py set-target "$TARGET_ARCH"
          idf.py build

      - name: Check firmware size
        shell: bash
        run: |
          python3 tools/check_partition_sizes.py \
            --partition-table partitions.csv \
            --firmware build/thistle_os.bin

      - name: Sign firmware
        if: env.THISTLE_SIGNING_KEY != ''
        env:
          THISTLE_SIGNING_KEY: ${{ secrets.THISTLE_SIGNING_KEY }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-venv
          python3 -m venv /tmp/thistle-signing-venv
          /tmp/thistle-signing-venv/bin/pip install -r tools/requirements.txt
          /tmp/thistle-signing-venv/bin/python -c "
          import json, os, pathlib, re
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from tools.sign import canonical_manifest
          key_hex = os.environ['THISTLE_SIGNING_KEY']
          sk = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(key_hex))
          data = open('build/thistle_os.bin', 'rb').read()
          sig = sk.sign(data)
          open('build/thistle_os.bin.sig', 'wb').write(sig)
          open('build/thistle_os.bin.pub', 'wb').write(sk.public_key().public_bytes_raw())
          source = pathlib.Path('components/kernel_rs/src/version.rs').read_text()
          version = re.search(r'VERSION_STRING: &str = \"([^\"]+)\"', source).group(1)
          security_version = int(re.search(r'SECURITY_VERSION: u32 = ([0-9]+)', source).group(1))
          target_arch = os.environ['TARGET_ARCH']
          boards = sorted(
              json.loads(path.read_text())['board']['board_id']
              for path in pathlib.Path('sdcard_layout/config/boards').glob('*.json')
              if json.loads(path.read_text()).get('board', {}).get('arch') == target_arch
          )
          manifest = canonical_manifest(
              artifact_type='firmware', artifact_id='thistle-os', version=version,
              security_version=security_version, arch=target_arch,
              compatible_boards=boards,
              url=f'https://github.com/{os.environ[\"GITHUB_REPOSITORY\"]}/releases/download/v{version}/thistle_os-{target_arch}-v{version}.bin',
              payload=data,
          )
          open('build/thistle_os.bin.manifest', 'wb').write(manifest)
          open('build/thistle_os.bin.manifest.sig', 'wb').write(sk.sign(manifest))
          board_output = pathlib.Path('build/signed-board-profiles')
          board_output.mkdir(exist_ok=True)
          for path in pathlib.Path('sdcard_layout/config/boards').glob('*.json'):
              profile = json.loads(path.read_text())
              metadata = profile['board']
              if metadata['arch'] != target_arch:
                  continue
              board_id = metadata['board_id']
              profile_version = metadata.get('version', '1.0.0')
              if profile_version.count('.') == 1:
                  profile_version += '.0'
              output = board_output / f'board-{board_id}.json'
              payload = path.read_bytes()
              output.write_bytes(payload)
              board_manifest = canonical_manifest(
                  artifact_type='board', artifact_id=board_id,
                  version=profile_version, security_version=1,
                  arch=metadata['arch'], compatible_boards=[board_id],
                  url=f'https://github.com/{os.environ[\"GITHUB_REPOSITORY\"]}/releases/download/v{version}/{output.name}',
                  payload=payload,
              )
              pathlib.Path(f'{output}.manifest').write_bytes(board_manifest)
              pathlib.Path(f'{output}.manifest.sig').write_bytes(sk.sign(board_manifest))
          print(f'Signed: {len(data)} bytes, sig: {sig.hex()[:32]}...')
          "

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: thistle-os-firmware-${{ matrix.arch }}
          path: |
            build/thistle_os.bin
            build/thistle_os.bin.sig
            build/thistle_os.bin.manifest
            build/thistle_os.bin.manifest.sig
            build/thistle_os.bin.pub
            build/signed-board-profiles/

  rust-tests:
    name: Rust Kernel Tests
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Cache Rust toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.rustup
          key: rust-stable-${{ runner.os }}-${{ hashFiles('components/kernel_rs/Cargo.lock') }}
          restore-keys: rust-stable-${{ runner.os }}-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v6
        with:
          path: components/kernel_rs/target
          key: rust-test-target-${{ runner.os }}-${{ hashFiles('components/kernel_rs/Cargo.lock') }}
          restore-keys: rust-test-target-${{ runner.os }}-

      - name: Install Rust
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run Rust kernel tests
        working-directory: components/kernel_rs
        run: cargo test --target x86_64-unknown-linux-gnu -- --test-threads=1

      - name: Install cargo-audit
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo-audit" ]; then
            cargo install cargo-audit
          fi

      - name: Run cargo-audit (Rust dependency CVE check)
        working-directory: components/kernel_rs
        run: cargo audit

  semgrep:
    name: Semgrep SAST
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Semgrep (text output for log visibility)
        run: |
          echo "::group::Semgrep scan results"
          semgrep scan \
            --config auto \
            --config p/default \
            --config .github/semgrep.yml \
            --error \
            --severity ERROR \
            --severity WARNING \
            components/ main/ 2>&1 || SCAN_EXIT=$?
          echo "::endgroup::"
          echo "Semgrep exit code: ${SCAN_EXIT:-0}"

      - name: Run Semgrep (SARIF output for GitHub Security tab)
        if: always()
        run: |
          semgrep scan \
            --config auto \
            --config p/default \
            --config .github/semgrep.yml \
            --sarif --output semgrep-results.sarif \
            components/ main/ || true

      - name: Check for ERROR/WARNING findings
        if: always()
        run: |
          if [ -f semgrep-results.sarif ]; then
            ERRORS=$(python3 -c "
          import json
          d = json.load(open('semgrep-results.sarif'))
          results = d.get('runs', [{}])[0].get('results', [])
          errors = [r for r in results if r.get('level') in ('error', 'warning')]
          for e in errors:
              loc = e.get('locations', [{}])[0].get('physicalLocation', {})
              uri = loc.get('artifactLocation', {}).get('uri', '?')
              line = loc.get('region', {}).get('startLine', '?')
              msg = e.get('message', {}).get('text', '?')[:120]
              print(f'::error file={uri},line={line}::{msg}')
          print(len(errors))
          " 2>/dev/null | tail -1)
            echo "Semgrep ERROR/WARNING findings: $ERRORS"
            if [ "$ERRORS" -gt 0 ] 2>/dev/null; then
              echo "::error::Semgrep found $ERRORS error/warning-level issues!"
              exit 1
            fi
          fi

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  trivy:
    name: Trivy Security Scan
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Run Trivy (SARIF for GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret,misconfig

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  recovery-build:
    name: Build Recovery OS (Rust/esp)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libudev-dev pkg-config python3-venv

      - name: Cache Rust ESP toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/.espup
          key: rust-esp-recovery-${{ runner.os }}-v3-rust185-espup016
          # Don't restore from older prefixes — v1 caches contain corrupt
          # espup 0.17.0 state that reproduces the "part" extension error.

      - name: Install Rust + espup + ldproxy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain 1.85.0
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install 1.85.0 --profile minimal
          # Pin espup to 0.16.0 — 0.17.0 (released 2026-04-17) has a regression
          # that aborts with "Unsuported file extension: 'part'" during install.
          if ! command -v espup &> /dev/null || [ "$(espup --version 2>/dev/null | awk '{print $2}')" != "0.16.0" ]; then
            cargo +1.85.0 install espup --version 0.16.0 --locked --force
          fi
          # Clear any stale .part files from prior interrupted runs so espup
          # doesn't try to re-use them.
          find "$HOME/.rustup" "$HOME/.espup" -name '*.part' -delete 2>/dev/null || true
          if [ ! -f "$HOME/export-esp.sh" ]; then
            espup install
          fi
          # ldproxy is the linker wrapper cargo invokes for xtensa-esp32s3-espidf.
          # espup installs the toolchain but not ldproxy; cargo install it explicitly.
          if ! command -v ldproxy &> /dev/null; then
            cargo +1.85.0 install ldproxy --version 0.3.5 --locked
          fi

      - name: Cache recovery target dir
        uses: actions/cache@v6
        with:
          path: recovery/target
          key: recovery-target-${{ runner.os }}-${{ hashFiles('recovery/Cargo.lock', 'recovery/src/**') }}
          restore-keys: recovery-target-${{ runner.os }}-

      - name: Build recovery
        shell: bash
        working-directory: recovery
        run: |
          . "$HOME/.cargo/env"
          . "$HOME/export-esp.sh"
          cargo build --release

      - name: Check recovery size
        run: |
          python3 tools/check_partition_sizes.py \
            --partition-table partitions.csv \
            --recovery recovery/target/xtensa-esp32s3-espidf/release/thistle-recovery

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: thistle-recovery
          path: recovery/target/xtensa-esp32s3-espidf/release/thistle-recovery
