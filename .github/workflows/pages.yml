name: Deploy Pages (Docs + WASM Simulator)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'components/apps_builtin/**'
      - 'components/kernel/**'
      - 'components/kernel_rs/**'
      - 'components/thistle_hal/**'
      - 'components/ui/**'
      - 'simulator/**'
      - 'wasm/**'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  THISTLE_CI_JOBS: 2

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs + WASM Simulator
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake xz-utils

      - name: Cache Rust toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('components/kernel_rs/Cargo.lock') }}
          restore-keys: rust-wasm-${{ runner.os }}-

      - name: Cache Rust WASM build
        uses: actions/cache@v6
        with:
          path: components/kernel_rs/target
          key: rust-wasm-target-${{ runner.os }}-${{ hashFiles('components/kernel_rs/Cargo.lock', 'components/kernel_rs/src/**', 'crates/thistle-tk/src/**') }}
          restore-keys: rust-wasm-target-${{ runner.os }}-

      - name: Cache LVGL
        uses: actions/cache@v6
        with:
          path: managed_components/lvgl__lvgl
          key: lvgl-v9.2.2

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.51
          actions-cache-folder: 'emsdk-cache'

      - name: Install Rust + WASM target
        run: |
          if [ ! -f "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # A self-hosted runner may already have a usable target even when a
          # previously restored rustup cache has stale component metadata.
          # Probe the compiler first so rustup does not collide with files that
          # are already installed.
          if ! printf '#![no_std]\n' | rustc \
            --crate-name thistle_wasm_target_probe \
            --crate-type lib \
            --target wasm32-unknown-emscripten \
            --out-dir "$RUNNER_TEMP" -; then
            rustup target add wasm32-unknown-emscripten
          fi

      - name: Build Rust kernel for WASM
        working-directory: components/kernel_rs
        run: cargo build --release --target wasm32-unknown-emscripten

      - name: Fetch LVGL (needed for WASM build)
        run: |
          mkdir -p managed_components/lvgl__lvgl
          if [ ! -d "managed_components/lvgl__lvgl/src" ]; then
            git clone --depth 1 --branch v9.2.2 https://github.com/lvgl/lvgl.git managed_components/lvgl__lvgl
          fi

      - name: Build WASM simulator
        run: |
          cd wasm
          mkdir -p build && cd build
          emcmake cmake ..
          make -j"$THISTLE_CI_JOBS"

      - name: Assemble Pages site
        run: |
          mkdir -p _site

          # Homepage
          cp site/index.html _site/

          # Documentation
          mkdir -p _site/docs
          cp -r docs/* _site/docs/

          # WASM simulator
          mkdir -p _site/simulator
          cp wasm/build/thistle_wasm.html _site/simulator/index.html
          cp wasm/build/thistle_wasm.js _site/simulator/
          cp wasm/build/thistle_wasm.wasm _site/simulator/
          cp wasm/build/thistle_wasm.data _site/simulator/ 2>/dev/null || true

          # App store catalog
          mkdir -p _site/apps
          cp simulator/sdcard/appstore/catalog.json _site/apps/ 2>/dev/null || true

          # Recovery board catalog
          mkdir -p _site/config/boards
          cp sdcard_layout/config/boards/*.json _site/config/boards/
          python3 tools/build_board_catalog.py \
            sdcard_layout/config/boards \
            --base-url "https://wan0net.github.io/thistle-os/config/boards" \
            --output _site/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","linux","x64","wan0-ci","thistle-os"]') }}
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v5
